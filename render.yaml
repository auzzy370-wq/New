services:
  - type: web
    name: tapflow-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health

    envVars:
      # ── DATABASE_URL ──────────────────────────────────────────
      # Set this manually in Render dashboard → tapflow-api → Environment
      # Use your Neon / Supabase / Railway connection string
      - key: DATABASE_URL
        sync: false

      # ── Auto-generated secrets ────────────────────────────────
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      # ── App config ────────────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: JWT_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_EXPIRATION
        value: 30d
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: FRONTEND_URL
        value: https://tapflow-api.onrender.com

      # ── Stripe ────────────────────────────────────────────────
      # App boots without this. Add your real key to enable payments.
      - key: STRIPE_SECRET_KEY
        value: ""
      - key: STRIPE_PLATFORM_FEE_RATE
        value: "0.01"
