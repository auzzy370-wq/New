databases:
  - name: tapflow-db
    databaseName: tapflow
    user: tapflowuser
    plan: free

services:
  - type: web
    name: tapflow-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health

    envVars:
      # ── Auto-injected by Render ───────────────────────────────
      - key: DATABASE_URL
        fromDatabase:
          name: tapflow-db
          property: connectionString

      # ── Auto-generated secrets ────────────────────────────────
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      # ── App config ────────────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: JWT_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_EXPIRATION
        value: 30d
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: FRONTEND_URL
        value: https://tapflow-api.onrender.com

      # ── Stripe ────────────────────────────────────────────────
      # App runs without this; add your key to enable real payments
      # Get keys from: https://dashboard.stripe.com/apikeys
      - key: STRIPE_SECRET_KEY
        value: ""
      - key: STRIPE_PLATFORM_FEE_RATE
        value: "0.01"
