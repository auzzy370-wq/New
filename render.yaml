services:
  - type: web
    name: tapflow-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health

    envVars:
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_7NEwOIS4mfWv@ep-withered-sea-axy6hrvt.c-4.us-east-2.aws.neon.tech/neondb?sslmode=require

      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: JWT_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_EXPIRATION
        value: 30d
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: FRONTEND_URL
        value: https://tapflow-api.onrender.com

      - key: STRIPE_SECRET_KEY
        value: ""
      - key: STRIPE_PLATFORM_FEE_RATE
        value: "0.01"
